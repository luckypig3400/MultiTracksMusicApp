
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>多音軌音樂播放器</title>
<!-- <link rel="icon" href="data:,"> -->

<style>
  :root { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans"; }
  html,body { height:100%; margin:0; background:#fafafa; color:#111; }
  .app { height:100%; display:flex; flex-direction:column; position:relative; }

  /* 30% 名稱 / 封面 */
  #music-name {
    height:30%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:1.4rem;
    user-select:none;
    cursor:pointer;
    border-bottom:1px solid #e0e0e0;
    padding:12px;
    box-sizing:border-box;
  }

  /* 5% 進度 */
  #progress-container {
    height:5%;
    display:flex;
    align-items:center;
    padding:0 8px;
    gap:8px;
    box-sizing:border-box;
    border-bottom:1px solid #eaeaea;
  }
  #time-current, #time-total { width:10%; text-align:center; font-size:0.9rem; }
  #progress { width:80%; height:6px; }

  /* 除錯訊息區塊 (預設隱藏，由 JS 控制顯示) */
  #debug-info {
    display: none;
    font-family: monospace;
    font-size: 0.75rem;
    color: #d32f2f;
    background: rgba(0,0,0,0.05);
    padding: 4px 8px;
    white-space: nowrap;
    overflow-x: auto;
    border-bottom: 1px solid #eaeaea;
  }
  .vscode-dark #debug-info {
    color: #ff6b6b;
    background: rgba(255,255,255,0.05);
    border-bottom: 1px solid #333;
  }

  /* 25% 控制 (修改為兩列佈局) */
  #controls {
    height:25%;
    display:flex;
    flex-direction: column; /* 改為垂直排列 */
    align-items:center;
    justify-content:center;
    gap:8px;
    box-sizing:border-box;
    border-bottom:1px solid #eaeaea;
    padding: 8px;
  }
  .control-row {
    display: flex;
    width: 100%;
    justify-content: space-around;
    align-items: center;
    gap: 8px;
  }
  #controls button {
    padding:10px 14px;
    font-size:1rem;
    border-radius:8px;
    border:1px solid #ccc;
    background:white;
    cursor:pointer;
    min-width: 44px;
  }

  /* 40% 音軌控制 */
  #volume-controls {
    height:40%;
    overflow-y:auto;
    padding:8px;
    box-sizing:border-box;
  }
  .volume-track {
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
  }
  .volume-track .lbl { width:5%; min-width:40px; font-size:0.9rem; text-align:left; }
  .volume-track input[type="range"] { width:85%; }
  .volume-track input[type="number"] { width:10%; box-sizing:border-box; padding:4px; }

  /* folder chooser popup */
  #folder-chooser {
    position: fixed;
    z-index: 9999;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display: none;
    width: 85vw;
    max-width: 400px;
    height: fit-content;
    max-height: 80vh;
    overflow-y: auto;
  }
  #folder-chooser p { margin:0 0 8px 0; }
  #folder-chooser input[type=file] { width:100%; }
  .hint-text { font-size: 0.9rem; color: #666; margin-top: 4px; }

  /* 小的閃爍樣式 */
  .progress-flash { background-color: rgba(255,0,0,0.6) !important; transition: background-color 0.1s; }
  .hidden { display:none !important; }

  /* Toast Notification */
  #toast-notification {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background-color: rgba(0, 0, 0, 0.7);
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 0.9rem;
    z-index: 10005;
    opacity: 0;
    transition: opacity 0.3s ease-in-out;
    pointer-events: none;
  }
  #toast-notification.show {
    opacity: 1;
  }
</style>
</head>
<body>
  <div class="app">
    <div id="music-name">尚未載入歌曲 - 請選擇音樂資料夾或至設定新增資料夾</div>

    <div id="progress-container">
      <div id="time-current">0:00</div>
      <input id="progress" type="range" min="0" max="100" value="0" />
      <div id="time-total">0:00</div>
    </div>
    
    <!-- 新增除錯訊息顯示區 -->
    <div id="debug-info"></div>

    <div id="controls">
      <!-- 第一列：播放控制 -->
      <div class="control-row">
        <button id="btn-random" title="隨機"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg></button>
        <button id="btn-prev" title="上一首"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg></button>
        <button id="btn-play" title="播放"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg></button>
        <button id="btn-next" title="下一首"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg></button>
        <button id="btn-repeat" title="重複"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg></button>
      </div>
      <!-- 第二列：功能按鈕 -->
      <div class="control-row">
        <button id="btn-playlist" title="播放清單"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg> 播放清單</button>
        <button id="btn-lyrics" title="歌詞">歌詞(Lyrics)</button>
        <button id="btn-settings" title="設定"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> 設定</button>
      </div>
    </div>

    <div id="volume-controls">
      <!-- 動態產生音軌控制 -->
    </div>

    <div id="folder-chooser" role="dialog" aria-modal="true">
      <p>首次使用請選擇一或多個音樂資料夾（會掃描資料夾內音訊檔案與歌詞）</p>
      <p class="hint-text">【如果沒有UVR5音訊檔案的話，可以到設定頁面載入範例音訊檔案，以及歌詞檔案】</p>
      <div style="margin-bottom: 12px;">
        <label style="display: block; margin-bottom: 4px; font-weight: bold;">選擇資料夾:</label>
        <input type="file" id="folder-input" webkitdirectory directory multiple />
      </div>
      <div style="margin-top:20px; text-align:right;">
        <button id="folder-ok" style="padding: 10px 24px; font-size: 1rem; background: #2196F3; color: white; border: none; border-radius: 6px; cursor: pointer;">關閉</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Element -->
  <div id="toast-notification">已複製歌名 (Copied title)</div>

  <script src="app.js"></script>
  <script src="playlist.js"></script>
  <script src="lyrics.js"></script>
  <script src="setting.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.ThemeManager) {
        ThemeManager.loadAndApplyTheme();
      }
    });
  </script>

</body>
</html>
